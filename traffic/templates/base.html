<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content=""/>
    <meta name="author" content=""/>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="icon" type="image/svg+xml"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='%23212529' d='M0 0h1v15h15v1H0zm10 3.5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V4.707L10.354 8.354a.5.5 0 0 1-.708 0L7.5 6.207l-4.146 4.147a.5.5 0 1 1-.708-.708l4.5-4.5a.5.5 0 0 1 .708 0L10 7.293l3.646-3.647H10.5a.5.5 0 0 1-.5-.5'/></svg>">
    <title>{% block title %}Fuel-Crash Correlation{% endblock %}</title>

    {% block scripts %} {% endblock %}

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container px-4 px-lg-5">
        <a class="navbar-brand" href="{% url 'dashboard' %}">Dashboard</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="{% url 'about' %}">O projekcie</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'used_data' %}">Użyte dane</a>
                </li>
            </ul>
            {% if user.is_authenticated %}
                <form class="d-flex" action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button class="btn btn-outline-dark me-2 mt-sm-2 mt-lg-0" type="submit">
                        Wyloguj
                    </button>
                </form>
                <div class="d-flex">
                    <a role="button" href="{% url 'profile' %}" class="btn btn-outline-dark">
                        Mój profil
                    </a>
                </div>
            {% else %}
                <div class="d-flex">
                    <a role="button" href="{% url 'login' %}" class="btn btn-outline-dark">
                        Zaloguj się
                    </a>
                </div>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container px-4 px-lg-5 mt-4 mb-5">
    {% block content %} {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
