<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    {% load static %}

    <h1>Wypadki drogowe a ceny paliw</h1>

    <button onclick="syncDatabase()">🔄 Sync with database</button>
    <p id="sync-status"></p>

    <canvas id="accidentsChart"></canvas>

    <script src="{% static 'traffic/dashboard.js' %}"></script>

    <script>
    async function syncDatabase() {
        document.getElementById("sync-status").textContent = "Synchronizacja...";
        const response = await fetch("/sync/", {
            method: "POST",
            headers: {"X-CSRFToken": "{{ csrf_token }}"}
        });
        const data = await response.json();
    document.getElementById("sync-status").textContent =
        `Gotowe! Wypadki — dodano: ${data.accidents.created}, pominięto: ${data.accidents.skipped} | ` +
        `Paliwa — dodano: ${data.fuel.created}, pominięto: ${data.fuel.skipped}`;
        loadChart();
        loadMonthlyCharts();
    }

    loadChart();
    loadMonthlyCharts();
    </script>

    <h2>Wypadki według miesięcy</h2>
    <div id="monthly-charts">
        {% for i in "123456789012" %}
        <canvas id="monthChart{{ forloop.counter }}"></canvas>
        {% endfor %}
    </div>
</body>
</html>
